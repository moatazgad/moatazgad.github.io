# --- SEO / social (jekyll-seo-tag) ---
twitter:
  card: summary
social:
  name: "Moataz Gad"
  links:
    - "https://github.com/moatazgad"
    - "https://www.linkedin.com/in/moataz-gad-250743183"

# --- Collections ---
collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# --- Build settings ---
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
