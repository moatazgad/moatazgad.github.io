<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__mark">{{ site.title }}</p>
    <ul class="site-footer__links">
      <li><a href="mailto:{{ site.email }}">Email</a></li>
      <li><a href="https://github.com/{{ site.github_username }}/" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
    <p class="site-footer__meta">&copy; {{ 'now' | date: "%Y" }}</p>
  </div>
</footer>
