<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Abstract geometric mark: three nodes joined by two strokes, echoing the
       nodes-and-edges "subway map" motif used in the project diagrams.
       Not derived from any specific person's initials. -->
  <rect width="32" height="32" rx="6" fill="#FAF9F6"/>
  <path d="M7 23L16 9L25 23" stroke="#14151A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="7" cy="23" r="2.25" fill="#2451B4"/>
  <circle cx="16" cy="9" r="2.25" fill="#14151A"/>
  <circle cx="25" cy="23" r="2.25" fill="#2451B4"/>
</svg>
